name: CI

on:
  push:
  pull_request:
  schedule:
    # Run daily (* needs quotes).
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        check-latest: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build coveralls setuptools tox wheel
        python -m pip install -r requirements.txt

    - name: Build Voldemort wheel
      run: python -m build

    - name: Install Voldemort wheel
      shell: bash
      run: python -m pip install dist/*.whl

    - name: Run Vulture
      run: |
        vulture vulture/ voldemort/ tests/
        python -m vulture vulture/ voldemort/ tests/

    - name: Run tests
      run: python -m tox -e py

    - name: Check Voldemort entry points
      run: |
        voldemort --version
        python -m voldemort --help

    - name: Report coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
